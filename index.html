<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags for "All AI" Ranking -->
    <title>All AI — 100+ Best AI Tools Directory | Powered by Said Hasan</title>
    <meta name="description" content="Explore All AI tools in one workspace. Access ChatGPT, Midjourney, Claude, Gemini, and top AI productivity engines instantly.">
    <meta name="keywords" content="All AI, All AI tools, AI Box, Best AI Apps, AI Directory, Said Hasan AI">
    <meta name="author" content="Said Hasan">

    <!-- Social Media Open Graph Tags -->
    <meta property="og:title" content="All AI — 100+ Best AI Tools Directory">
    <meta property="og:description" content="Explore All AI tools in one place. Powered by Said Hasan.">
    <meta property="og:type" content="website">

    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0f17;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* NAVBAR */
        header {
            background: rgba(11, 15, 23, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .dev-badge {
            background: rgba(251, 191, 36, 0.1);
            color: var(--gold);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* HERO SECTION */
        .hero-section {
            text-align: center;
            padding: 40px 20px 24px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* LIVE STATS BAR */
        .live-stats-bar {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            background: rgba(22, 30, 46, 0.8);
            border: 1px solid var(--card-border);
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stat-value {
            color: #fff;
            font-weight: 700;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* SEARCH BAR */
        .search-wrapper {
            position: relative;
            max-width: 650px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            background: rgba(22, 30, 46, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .search-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* CATEGORIES */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px 60px;
            flex: 1;
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 12px 0 20px;
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-chip.active, .cat-chip:hover {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* AI GRID */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .ai-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .ai-card:hover {
            transform: translateY(-6px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.15);
            background: rgba(30, 41, 59, 0.8);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .icon-wrapper {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .fav-star {
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .fav-star.active { color: var(--gold); }

        .ai-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .ai-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            flex: 1;
        }

        .card-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cat-tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #818cf8;
            background: rgba(129, 140, 248, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .launch-icon {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.2s, color 0.2s;
        }

        .ai-card:hover .launch-icon {
            transform: translateX(3px) translateY(-3px);
            color: #fff;
        }

        /* FOOTER */
        footer {
            background: rgba(11, 15, 23, 0.95);
            border-top: 1px solid var(--card-border);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <a href="#" class="brand-logo">
            <div class="logo-box"><i class="fa-solid fa-cube"></i></div>
            <div>
                <div class="brand-title">AI Box</div>
                <div class="brand-subtitle">Super App Platform</div>
            </div>
        </a>
        <div class="dev-badge">
            <i class="fa-solid fa-code"></i> Developer by Said Hasan
        </div>
    </header>

    <!-- HERO & SEARCH -->
    <div class="hero-section">
        <h1 class="hero-title">Explore <span>All AI Tools</span> in One Place</h1>
        <p class="hero-desc">Access ChatGPT, Midjourney, Claude, Gemini, and top AI productivity engines instantly.</p>

        <!-- VISITOR COUNTER -->
        <div class="live-stats-bar">
            <div class="stat-item">
                <span class="pulse-dot"></span>
                <span>Status:</span>
                <span class="stat-value" id="activeUsersCount">Online</span>
            </div>
            <div style="width: 1px; height: 12px; background: rgba(255,255,255,0.1);"></div>
            <div class="stat-item">
                <i class="fa-solid fa-eye" style="color: #818cf8;"></i>
                <span>Total Page Views:</span>
                <span class="stat-value" id="totalVisitsCount">0</span>
            </div>
        </div>
        
        <!-- SEARCH BAR -->
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name, category, or workflow...">
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- CATEGORIES -->
        <div class="category-scroll">
            <button class="cat-chip active" onclick="filterCategory('ALL')"><i class="fa-solid fa-border-all"></i> All Tools</button>
            <button class="cat-chip" onclick="filterCategory('FAVORITES')"><i class="fa-solid fa-star"></i> Favorites</button>
            <button class="cat-chip" onclick="filterCategory('CHAT')"><i class="fa-solid fa-comment-dots"></i> Chat & Writing</button>
            <button class="cat-chip" onclick="filterCategory('IMAGE')"><i class="fa-solid fa-wand-magic-sparkles"></i> Image & Design</button>
            <button class="cat-chip" onclick="filterCategory('VIDEO')"><i class="fa-solid fa-video"></i> Video & Animation</button>
            <button class="cat-chip" onclick="filterCategory('VOICE')"><i class="fa-solid fa-microphone"></i> Voice & Music</button>
            <button class="cat-chip" onclick="filterCategory('CODING')"><i class="fa-solid fa-code"></i> Coding & Dev</button>
            <button class="cat-chip" onclick="filterCategory('BUSINESS')"><i class="fa-solid fa-briefcase"></i> Business & Docs</button>
            <button class="cat-chip" onclick="filterCategory('RESEARCH')"><i class="fa-solid fa-flask"></i> Research</button>
        </div>

        <!-- AI GRID -->
        <div class="ai-grid" id="aiGrid"></div>
    </div>

    <!-- FOOTER -->
    <footer>
        AI Box — Powered by Said Hasan © 2026
    </footer>

    <script>
        const aiServices = [
            { name: "ChatGPT", url: "https://chatgpt.com", icon: "🤖", cat: "CHAT", desc: "OpenAI Conversational & Writing AI" },
            { name: "Gemini", url: "https://gemini.google.com", icon: "✨", cat: "CHAT", desc: "Google Multimodal Smart Assistant" },
            { name: "Claude AI", url: "https://claude.ai", icon: "🧠", cat: "CHAT", desc: "Anthropic Next-Gen Intelligent Assistant" },
            { name: "Perplexity", url: "https://www.perplexity.ai", icon: "🔍", cat: "CHAT", desc: "Real-time Conversational Search Engine" },
            { name: "Poe", url: "https://poe.com", icon: "💬", cat: "CHAT", desc: "Multi-Model AI Ecosystem & Bots" },
            { name: "QuillBot", url: "https://quillbot.com", icon: "✍️", cat: "CHAT", desc: "AI Paraphrasing & Grammar Checker" },
            { name: "Midjourney", url: "https://www.midjourney.com", icon: "🎨", cat: "IMAGE", desc: "Industry Leading Image Generator" },
            { name: "Canva AI", url: "https://www.canva.com", icon: "🖼️", cat: "IMAGE", desc: "Smart AI Design Suite & Photo Tools" },
            { name: "Leonardo AI", url: "https://leonardo.ai", icon: "🔮", cat: "IMAGE", desc: "Production Quality Asset Creation" },
            { name: "Playground AI", url: "https://playground.com", icon: "🎭", cat: "IMAGE", desc: "Free Creative Image & Canvas Generator" },
            { name: "Adobe Firefly", url: "https://firefly.adobe.com", icon: "🔥", cat: "IMAGE", desc: "Commercial Generative Art Engine" },
            { name: "Remove.bg", url: "https://www.remove.bg", icon: "🔳", cat: "IMAGE", desc: "Automatic Background Eraser" },
            { name: "Runway ML", url: "https://runwayml.com", icon: "🎥", cat: "VIDEO", desc: "Professional AI Video & VFX Generation" },
            { name: "HeyGen", url: "https://www.heygen.com", icon: "👤", cat: "VIDEO", desc: "Realistic Digital Avatar Video Creator" },
            { name: "ElevenLabs", url: "https://elevenlabs.io", icon: "🎙️", cat: "VOICE", desc: "Ultra-Realistic Text-to-Speech Voice" },
            { name: "Suno AI", url: "https://suno.com", icon: "🎵", cat: "VOICE", desc: "Generative Music & Song Creator" },
            { name: "Phind", url: "https://www.phind.com", icon: "💻", cat: "CODING", desc: "AI Search Engine Customized for Coders" },
            { name: "Replit Agent", url: "https://replit.com", icon: "⚡", cat: "CODING", desc: "Cloud IDE with Autonomous Coding AI" },
            { name: "v0.dev", url: "https://v0.dev", icon: "📐", cat: "CODING", desc: "Generative UI System by Vercel" },
            { name: "Gamma App", url: "https://gamma.app", icon: "📊", cat: "BUSINESS", desc: "Instant AI Slides & Document Creator" },
            { name: "ChatPDF", url: "https://www.chatpdf.com", icon: "📑", cat: "BUSINESS", desc: "Interactive PDF Reader & Summarizer" },
            { name: "Consensus", url: "https://consensus.app", icon: "🔬", cat: "RESEARCH", desc: "Search Academic Papers with AI" }
        ];

        let currentCat = 'ALL';
        let favorites = JSON.parse(localStorage.getItem('aibox_favs')) || [];

        function renderGrid() {
            const grid = document.getElementById('aiGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = aiServices.filter(ai => {
                const matchCat = (currentCat === 'ALL') || 
                                 (currentCat === 'FAVORITES' && favorites.includes(ai.name)) || 
                                 (ai.cat === currentCat);
                const matchSearch = ai.name.toLowerCase().includes(search) || ai.desc.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 60px;">No AI tools match your search criteria</div>`;
                return;
            }

            filtered.forEach(ai => {
                const isFav = favorites.includes(ai.name);
                const card = document.createElement('a');
                card.className = 'ai-card';
                card.href = ai.url;
                card.target = '_blank';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="icon-wrapper">${ai.icon}</div>
                        <i class="fa-star fav-star ${isFav ? 'fa-solid active' : 'fa-regular'}" onclick="toggleFav(event, '${ai.name}')"></i>
                    </div>
                    <div class="ai-title">${ai.name}</div>
                    <div class="ai-desc">${ai.desc}</div>
                    <div class="card-footer">
                        <span class="cat-tag">${ai.cat}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square launch-icon"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleFav(e, name) {
            e.preventDefault();
            e.stopPropagation();
            if (favorites.includes(name)) {
                favorites = favorites.filter(f => f !== name);
            } else {
                favorites.push(name);
            }
            localStorage.setItem('aibox_favs', JSON.stringify(favorites));
            renderGrid();
        }

        function filterCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderGrid();
        }

        document.getElementById('searchInput').addEventListener('input', renderGrid);

      async function initCounters() {
            try {
                const response = await fetch('https://api.counterapi.dev/v1/saidhasan-aibox/pageviews/up');
                const data = await response.json();
                const countValue = (data && data.count !== undefined) ? data.count : 86;
                
                // সব সম্ভাব্য আইডি একসাথে চেক করে আপডেট করবে, যাতে মিসম্যাচ না হয়
                ['totalVisitsCount', 'visitor-count', 'total-page-views'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.innerText = countValue.toLocaleString();
                    }
                });
            } catch (error) {
                console.error('Counter Error:', error);
            }
            
            const activeEl = document.getElementById('activeUsersCount');
            if (activeEl) {
                activeEl.innerText = 'Online';
            }
        }
        }
    } catch (error) {
        console.error('Counter Error:', error);
        document.getElementById('totalVisitsCount').innerText = '86';
    }
    document.getElementById('activeUsersCount').innerText = 'Online';
}

        renderGrid();
        initCounters();
    </script>
</body>
</html>
